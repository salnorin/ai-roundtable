<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-store">
<title>دفتر · AI Roundtable</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/office-page.css?v=20261110d">
<style>
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:12px;padding:3px;gap:2px}
.seg a,.seg button{border:0;background:transparent;color:#a3a8bb;padding:7px 14px;border-radius:9px;display:flex;gap:6px;align-items:center;font:inherit;cursor:pointer;text-decoration:none}
.seg a.on,.seg button.on{background:rgba(255,255,255,.14);color:#eef0f6}
#wrap{position:absolute;inset:0;top:52px;display:flex;flex-direction:column}
#taskbar{flex:none}
#view{flex:1;position:relative;min-height:0;background:#1a1030}
#view canvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;cursor:crosshair}
#tip{position:absolute;z-index:8;min-width:220px;max-width:300px;padding:10px 12px;border-radius:12px;background:rgba(16,18,28,.95);border:1px solid rgba(255,255,255,.14);color:#eef0f6;font-size:12.5px;line-height:1.55;display:none;pointer-events:none;box-shadow:0 12px 32px rgba(0,0,0,.45)}
#tip h4{margin:0 0 6px;font-size:14px}
#tip .kv{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid rgba(255,255,255,.06);padding:2px 0}
#tip .bar{height:7px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;margin:2px 0 6px}
#tip .bar>i{display:block;height:100%;background:#7c6cff}
#tip .fat>i{background:#f0a92e}#tip .fru>i{background:#ef4b5b}#tip .use>i{background:#2fbf71}#tip .harm>i{background:#c0392b}
</style>
</head>
<body>
<header class="top">
  <div class="lights" style="display:flex;gap:6px"><i style="width:10px;height:10px;border-radius:50%;background:#ff5f57"></i><i style="width:10px;height:10px;border-radius:50%;background:#febc2e"></i><i style="width:10px;height:10px;border-radius:50%;background:#28c840"></i></div>
  <h1>AI Roundtable · دفتر پیکسلی</h1>
  <nav class="seg">
    <a href="/" data-i18n="tabChat">گفتگو</a>
    <a class="on" href="/office" data-i18n="tabOffice">دفتر</a>
    <a href="/#admin" data-i18n="tabAdmin">مدیریت</a>
    <a href="/#lang" data-i18n="tabLang">زبان</a>
  </nav>
</header>
<div id="wrap">
  <div id="taskbar" class="taskbar">
    <div class="row"><b id="goal">—</b><span id="meta">—</span></div>
    <div class="bar" title="پیشرفت"><i id="pfill"></i></div>
  </div>
  <div id="view">
    <canvas id="c" width="640" height="360"></canvas>
    <div id="tip"></div>
    <div class="legend">پیکسل‌ارت دوبعدی · هاور روی کارمند = آمار · پیاده‌روی تا مدیر برای تحویل گزارش رمزی</div>
  </div>
</div>
<script src="/static/i18n.js?v=20261110d"></script>
<script src="/static/office-app.js?v=20261110d"></script>
</body>
</html>
